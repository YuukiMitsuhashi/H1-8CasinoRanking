<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>High Rollers Leaderboard</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Monoton&display=swap" rel="stylesheet">
<style>
  :root{--gold:#f5c542;--red:#c8102e;--cream:#fff8e1}
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;padding:14px 10px 50px;
    font-family:'Bungee',Impact,sans-serif;color:var(--cream);
    background:
      repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 2px,transparent 2px 26px),
      repeating-linear-gradient(-45deg,rgba(255,255,255,.035) 0 2px,transparent 2px 26px),
      radial-gradient(ellipse at 50% 0%,#8f1024 0%,#3a0610 45%,#050102 100%);
    background-attachment:fixed;
  }
  .wrap{max-width:920px;margin:0 auto}
  input,button{font-family:inherit;font-size:.95rem}

  .head{display:flex;align-items:center;justify-content:space-between;gap:10px}
  h1{
    font-family:'Monoton',cursive;font-weight:400;text-align:center;line-height:1.05;margin:0;
    font-size:clamp(1.5rem,7.5vw,4.4rem);color:#ffd75e;
    text-shadow:0 0 6px #ff3b5c,0 0 18px #ff1744,0 0 34px #c8102e;
  }
  .roul{width:clamp(76px,16vw,150px);height:clamp(76px,16vw,150px);flex:none;filter:drop-shadow(0 4px 6px #000)}
  .roul svg{width:100%;height:100%;animation:spin 14s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .dice{display:flex;gap:8px;cursor:pointer;flex:none;width:clamp(76px,16vw,150px);justify-content:center}
  .die{width:clamp(34px,7.2vw,68px);height:clamp(34px,7.2vw,68px);filter:drop-shadow(0 4px 5px #000);animation:tumble 2.6s ease-in-out infinite}
  .die+.die{animation-delay:-1.3s}
  .die svg{width:100%;height:100%;display:block}
  @keyframes tumble{0%,100%{transform:rotate(-10deg) translateY(0)}50%{transform:rotate(10deg) translateY(-8px)}}

  /* chasing marquee lights around the board */
  .frame{position:relative;padding:26px;margin-top:10px}
  .bulbs{position:absolute;display:block;pointer-events:none;filter:drop-shadow(0 0 5px #ffb400)}
  .bulbs.h{left:0;right:0;height:22px;animation:chH 1s steps(1) infinite;
    background:radial-gradient(circle,#fff6c2 4px,#ffb400 6px,transparent 7px) 11px 50%/44px 100% repeat-x,
               radial-gradient(circle,#5a3d00 5px,transparent 6px) 33px 50%/44px 100% repeat-x}
  .bulbs.v{top:22px;bottom:22px;width:22px;animation:chV 1s steps(1) infinite;
    background:radial-gradient(circle,#fff6c2 4px,#ffb400 6px,transparent 7px) 50% 11px/100% 44px repeat-y,
               radial-gradient(circle,#5a3d00 5px,transparent 6px) 50% 33px/100% 44px repeat-y}
  .t{top:0}.b{bottom:0}.l{left:0}.r{right:0}
  @keyframes chH{0%{background-position:11px 50%,33px 50%}50%{background-position:33px 50%,11px 50%}}
  @keyframes chV{0%{background-position:50% 11px,50% 33px}50%{background-position:50% 33px,50% 11px}}

  .board{
    border:4px solid var(--gold);border-radius:18px;padding:clamp(6px,1.4vw,14px) clamp(8px,1.8vw,18px);
    background:rgba(0,0,0,.6);box-shadow:0 0 26px rgba(245,197,66,.35) inset,0 8px 24px rgba(0,0,0,.6);
  }

  /* big rows for the top 5 */
  .row{
    position:relative;display:grid;grid-template-columns:clamp(46px,9vw,76px) 1fr auto;align-items:center;
    gap:clamp(8px,2vw,20px);
    padding:clamp(12px,2.6vw,24px) clamp(12px,2.4vw,26px);
    margin:clamp(8px,1.6vw,16px) 0;border-radius:16px;
    font-size:clamp(1.25rem,4.8vw,2.6rem);
    background:linear-gradient(90deg,rgba(255,255,255,.12),rgba(255,255,255,.03));
    border:2px solid rgba(245,197,66,.35);
  }
  .board.dealer .row{grid-template-columns:clamp(46px,9vw,76px) 1fr auto auto}
  .rank{
    width:clamp(42px,8.5vw,70px);height:clamp(42px,8.5vw,70px);border-radius:50%;
    display:grid;place-items:center;font-size:clamp(1rem,3.6vw,1.9rem);
    background:var(--red);border:4px dashed #fff;box-shadow:0 3px 6px rgba(0,0,0,.6);
  }
  .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.02em}
  .score{
    min-width:clamp(86px,18vw,180px);text-align:center;padding:.1em .45em;border-radius:999px;
    background:#0b0b0b;color:var(--gold);border:3px solid var(--gold);text-shadow:0 0 8px rgba(245,197,66,.8);
  }
  .row.top1{background:linear-gradient(90deg,#f5c542,#b8860b);color:#2b1d00;font-size:clamp(1.5rem,5.8vw,3.2rem);
    box-shadow:0 0 30px rgba(245,197,66,.7)}
  .row.top2{background:linear-gradient(90deg,#e4e4e4,#8f8f8f);color:#1d1d1d}
  .row.top3{background:linear-gradient(90deg,#d08a4b,#8a5122);color:#1f1000}
  .top1 .rank,.top2 .rank,.top3 .rank{background:#111;color:var(--gold);border-color:var(--gold)}
  .empty{text-align:center;padding:36px 10px;opacity:.9;font-size:clamp(1rem,3.5vw,1.6rem)}

  /* dealer-only rows below 5th place stay small */
  .divider{text-align:center;font-size:.75rem;color:var(--gold);opacity:.85;margin:18px 0 4px}
  .row.extra{
    grid-template-columns:34px 1fr auto;padding:6px 10px;margin:6px 0;font-size:1rem;border-radius:10px;
    box-shadow:none;background:linear-gradient(90deg,rgba(255,255,255,.1),rgba(255,255,255,.03));color:var(--cream);
    border:1px solid rgba(245,197,66,.3);
  }
  .board.dealer .row.extra{grid-template-columns:34px 1fr auto auto}
  .row.extra .rank{width:30px;height:30px;font-size:.8rem;border-width:2px}
  .row.extra .score{min-width:64px;border-width:2px;font-size:1rem}

  .cards{display:flex;justify-content:center;margin-top:10px}
  .cardwrap{width:clamp(56px,11vw,92px);margin-left:-18px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.6))}
  .cardwrap:first-child{margin-left:0}
  .cardwrap svg{display:block;width:100%;height:auto}

  .toast{
    position:fixed;top:10px;left:50%;transform:translate(-50%,-160%);z-index:9;
    background:#000;color:var(--gold);border:2px solid var(--gold);padding:10px 20px;border-radius:999px;
    transition:transform .35s;max-width:90vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:clamp(.85rem,2.5vw,1.2rem);
    box-shadow:0 0 18px rgba(245,197,66,.6);
  }
  .toast.show{transform:translate(-50%,0)}
  #soundBtn{position:fixed;top:10px;right:10px;z-index:8;padding:6px 10px;font-size:.7rem}

  .actions{display:flex;gap:6px}
  .editIn{padding:6px 8px;font-size:1rem;border-radius:6px;width:100%;min-width:0;border:2px solid var(--gold);background:#fffdf3;color:#222}
  .scoreEdit{width:96px}
  .panel{margin-top:22px;padding:16px;border-radius:14px;border:2px solid var(--gold);background:rgba(0,0,0,.5)}
  .panel h2{margin:0 0 10px;font-weight:400;color:var(--gold)}
  input{padding:10px 12px;border-radius:8px;border:2px solid var(--gold);background:#fffdf3;color:#222;width:100%}
  .inline{display:flex;gap:8px;flex-wrap:wrap}
  .inline input{flex:1;min-width:120px}
  button{padding:10px 18px;border-radius:8px;border:2px solid #7a5a00;background:linear-gradient(#ffd75e,#e0a800);color:#2b1d00;cursor:pointer}
  button:hover{filter:brightness(1.1)}
  button.dark{background:#222;color:var(--gold);border-color:var(--gold)}
  .mini{padding:4px 9px;font-size:.95rem;line-height:1.1;border-radius:6px;background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.6)}
  .mini.del{color:#ff9aa8}
  .msg{min-height:1.2em;margin-top:8px;color:#ffb3bd;font-size:.85rem}
  .hint{font-size:.75rem;opacity:.85;margin:10px 0}
  .center{text-align:center}
  .hidden{display:none}
  .version{text-align:center;margin-top:30px;font-size:.7rem;opacity:.5}
</style>
</head>
<body>
<button class="dark" id="soundBtn">🔈 Tap for sound</button>
<div class="toast" id="toast"></div>

<div class="wrap">
  <div class="head">
    <div class="roul" id="roul"></div>
    <h1>HIGH<br>ROLLERS</h1>
    <div class="dice" id="dice" title="Roll the dice"></div>
  </div>

  <div class="frame">
    <i class="bulbs h t"></i><i class="bulbs h b"></i><i class="bulbs v l"></i><i class="bulbs v r"></i>
    <div class="board" id="board"></div>
  </div>
  <div class="cards" id="cards"></div>

  <div class="center" style="margin-top:22px" id="loginArea">
    <button class="dark" id="showLoginBtn">🎩 Dealer Entrance</button>
    <div class="panel hidden" id="loginPanel">
      <div class="inline">
        <input type="password" id="pw" placeholder="Enter password" autocomplete="off">
        <button id="loginBtn">Enter</button>
      </div>
      <div class="msg" id="loginMsg"></div>
    </div>
  </div>

  <div class="panel hidden" id="dealerPanel">
    <h2>🎰 Dealer Table</h2>
    <div class="inline">
      <input type="text" id="nameIn" placeholder="Player name" maxlength="30">
      <input type="number" id="scoreIn" placeholder="Score" step="any">
      <button id="addBtn">Deal</button>
    </div>
    <div class="msg" id="addMsg"></div>
    <div class="hint">Changes go live for everyone right away. Visitors see only the top 5; you see everyone so you can fix any score with ✏️ or remove it with 🗑.</div>
    <button class="dark" id="logoutBtn">Leave table</button>
  </div>

  <div class="version">v7</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getDatabase, ref, onValue, push, set, remove }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA4xWrwRqTNKa1j2dPNpBOy7VDRg1pi5v0",
    authDomain: "h1-8casinoranking.firebaseapp.com",
    databaseURL: "https://h1-8casinoranking-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "h1-8casinoranking",
    storageBucket: "h1-8casinoranking.firebasestorage.app",
    messagingSenderId: "672314870065",
    appId: "1:672314870065:web:310c85c1eb41f876e58810",
    measurementId: "G-X3EZHW0XRT"
  };
  const DEALER_EMAIL = "dealer@highrollers.app";
  const TOP = 5;

  const $ = id => document.getElementById(id);

  /* ================= ILLUSTRATIONS ================= */
  const SUITS = {
    S:{col:"#1a1a1a",g:'<path d="M12 2C12 2 3 9 3 14C3 17 5.5 18.5 8 18.5C9.5 18.5 10.7 17.9 11.3 17C11 19 10.3 20.5 8.5 22L15.5 22C13.7 20.5 13 19 12.7 17C13.3 17.9 14.5 18.5 16 18.5C18.5 18.5 21 17 21 14C21 9 12 2 12 2Z"/>'},
    H:{col:"#c8102e",g:'<path d="M12 21C12 21 3 14.5 3 8.5C3 5.5 5.3 3.5 8 3.5C9.8 3.5 11.3 4.5 12 6C12.7 4.5 14.2 3.5 16 3.5C18.7 3.5 21 5.5 21 8.5C21 14.5 12 21 12 21Z"/>'},
    D:{col:"#c8102e",g:'<path d="M12 2L21 12L12 22L3 12Z"/>'},
    C:{col:"#1a1a1a",g:'<circle cx="12" cy="7.5" r="4.6"/><circle cx="7" cy="14" r="4.6"/><circle cx="17" cy="14" r="4.6"/><path d="M12 11C12 16 11 19 9 22L15 22C13 19 12 16 12 11Z"/>'}
  };
  function card(rank, suit){
    const s = SUITS[suit];
    const corner = '<text x="9" y="27" font-size="24" font-weight="900" fill="'+s.col+'" font-family="Georgia,serif">'+rank+'</text>'+
      '<g transform="translate(8,32) scale(0.75)" fill="'+s.col+'">'+s.g+'</g>';
    return '<svg viewBox="0 0 100 140"><rect x="2" y="2" width="96" height="136" rx="10" fill="#fffdf3" stroke="#222" stroke-width="2.5"/>'+
      corner+'<g transform="rotate(180 50 70)">'+corner+'</g>'+
      '<g transform="translate(50,70) scale(2.4) translate(-12,-12)" fill="'+s.col+'">'+s.g+'</g></svg>';
  }

  const PIPS = {1:[[50,50]],2:[[28,28],[72,72]],3:[[28,28],[50,50],[72,72]],4:[[28,28],[72,28],[28,72],[72,72]],
    5:[[28,28],[72,28],[50,50],[28,72],[72,72]],6:[[28,24],[72,24],[28,50],[72,50],[28,76],[72,76]]};
  function die(n, body, pip){
    let s = '<svg viewBox="0 0 100 100"><rect x="4" y="4" width="92" height="92" rx="18" fill="'+body+'" stroke="#111" stroke-width="4"/>';
    PIPS[n].forEach(p => s += '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="9" fill="'+pip+'"/>');
    return s + '</svg>';
  }
  function rollDice(){
    const a = 1+Math.floor(Math.random()*6), b = 1+Math.floor(Math.random()*6);
    $("dice").innerHTML = '<div class="die">'+die(a,"#c8102e","#fff")+'</div><div class="die">'+die(b,"#fffdf3","#111")+'</div>';
  }

  function roulette(){
    const n = 16, pt = (r,a) => [100+r*Math.cos(a), 100+r*Math.sin(a)];
    let s = '<svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="98" fill="#4a2a0c" stroke="#f5c542" stroke-width="4"/><circle cx="100" cy="100" r="88" fill="#d9a441"/>';
    for(let i = 0; i < n; i++){
      const a1 = (i*360/n-90)*Math.PI/180, a2 = ((i+1)*360/n-90)*Math.PI/180;
      s += '<path d="M'+pt(84,a1)+'A84 84 0 0 1 '+pt(84,a2)+'L'+pt(50,a2)+'A50 50 0 0 0 '+pt(50,a1)+'Z" fill="'+
        (i===0?"#0b7a4b":i%2?"#141414":"#c8102e")+'" stroke="#f5c542" stroke-width="1.5"/>';
    }
    const ball = pt(67, (4.5*360/n-90)*Math.PI/180);
    s += '<circle cx="100" cy="100" r="46" fill="#4a2a0c" stroke="#f5c542" stroke-width="3"/>'+
         '<path d="M100 58V142M58 100H142" stroke="#f5c542" stroke-width="5" stroke-linecap="round"/>'+
         '<circle cx="100" cy="100" r="9" fill="#f5c542"/>'+
         '<circle cx="'+ball[0]+'" cy="'+ball[1]+'" r="5" fill="#fff" stroke="#888"/></svg>';
    return s;
  }

  function drawDecor(){
    $("roul").innerHTML = roulette();
    rollDice();
    $("dice").onclick = rollDice;
    $("cards").innerHTML = [["A","S",-14],["K","H",-5],["Q","D",5],["J","C",14]]
      .map(c => '<div class="cardwrap" style="transform:rotate('+c[2]+'deg)">'+card(c[0],c[1])+'</div>').join("");
  }

  /* ================= SOUND (DJ air horn) ================= */
  let ctx = null, soundOn = true;

  function unlock(){
    try {
      if(!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      return ctx.resume();
    } catch(e){ return null; }
  }
  function updateSoundBtn(){
    $("soundBtn").textContent = !soundOn ? "🔇 Sound off"
      : (ctx && ctx.state === "running" ? "🔊 Sound on" : "🔈 Tap for sound");
  }
  // Browsers only allow sound after the visitor touches the page once
  ["pointerdown","keydown"].forEach(ev => document.addEventListener(ev, e => {
    if(e.target.closest && e.target.closest("#soundBtn")) return;
    Promise.resolve(unlock()).then(updateSoundBtn);
  }, {passive:true}));
  $("soundBtn").onclick = () => {
    if(!ctx || ctx.state !== "running"){
      soundOn = true;
      Promise.resolve(unlock()).then(() => { updateSoundBtn(); horn(); });   // preview
    } else {
      soundOn = !soundOn;
      updateSoundBtn();
    }
  };

  function horn(){
    if(!soundOn || !ctx || ctx.state !== "running") return;
    const t = ctx.currentTime, out = ctx.createGain(), lp = ctx.createBiquadFilter();
    lp.type = "lowpass"; lp.frequency.value = 3200;
    out.gain.value = .2; lp.connect(out); out.connect(ctx.destination);
    // three blasts: short, short, long with a pitch drop
    [[0,.15],[.2,.15],[.4,.85]].forEach(([s,d],k) => {
      [392,494,587,784].forEach(f => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = "sawtooth";
        o.frequency.setValueAtTime(f*.85, t+s);
        o.frequency.exponentialRampToValueAtTime(f, t+s+.04);
        if(k === 2) o.frequency.exponentialRampToValueAtTime(f*.88, t+s+d);
        g.gain.setValueAtTime(0, t+s);
        g.gain.linearRampToValueAtTime(.5, t+s+.02);
        g.gain.setValueAtTime(.5, t+s+d-.06);
        g.gain.linearRampToValueAtTime(0, t+s+d);
        o.connect(g); g.connect(lp); o.start(t+s); o.stop(t+s+d+.05);
      });
    });
  }

  let toastTimer;
  function toast(msg){
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 3200);
  }

  /* ================= STATE ================= */
  let entries = [], ranks = {};
  let loaded = false, loadError = "", editingKey = null, isAdmin = false;
  const configured = !String(firebaseConfig.apiKey).startsWith("PASTE");
  let app, auth, db;

  function el(tag, cls, text){
    const e = document.createElement(tag);
    if(cls) e.className = cls;
    if(text !== undefined) e.textContent = text;
    return e;
  }
  function btn(label, cls, title, fn){
    const b = el("button", cls, label);
    b.type = "button"; b.title = title; b.onclick = fn;
    return b;
  }

  /* ================= RENDER (with rise animation) ================= */
  function render(animate){
    const board = $("board");

    // remember where every row is now, so we can slide it to its new spot
    const old = {};
    board.querySelectorAll(".row[data-key]").forEach(r => { old[r.dataset.key] = r.getBoundingClientRect().top; });

    board.textContent = "";
    board.classList.toggle("dealer", isAdmin);

    if(!configured) board.appendChild(el("div","empty","Setup not finished: paste your Firebase config into index.html."));
    else if(loadError) board.appendChild(el("div","empty","Could not load the ranking: " + loadError));
    else if(!loaded) board.appendChild(el("div","empty","Shuffling the deck… 🃏"));
    else if(entries.length === 0) board.appendChild(el("div","empty","No players at the table yet. Place your bets! 🎲"));

    const sorted = entries.slice().sort((a,b) => b.score - a.score);
    const shown = isAdmin ? sorted : sorted.slice(0, TOP);
    const made = [];

    shown.forEach((p, i) => {
      if(isAdmin && i === TOP){
        board.appendChild(el("div","divider","▼ Below the top " + TOP + " (only you can see these) ▼"));
      }
      const row = el("div", "row" + (i < 3 ? " top"+(i+1) : "") + (i >= TOP ? " extra" : ""));
      row.dataset.key = p.key;
      row.appendChild(el("div", "rank", String(i+1)));

      if(isAdmin && editingKey === p.key){
        const nameIn = el("input","editIn"); nameIn.type = "text"; nameIn.maxLength = 30; nameIn.value = p.name;
        const scoreIn = el("input","editIn scoreEdit"); scoreIn.type = "number"; scoreIn.step = "any"; scoreIn.value = p.score;
        const doSave = () => saveEdit(p.key, nameIn.value, scoreIn.value);
        const doCancel = () => { editingKey = null; render(); };
        [nameIn, scoreIn].forEach(inp => inp.addEventListener("keydown", e => {
          if(e.key === "Enter") doSave();
          if(e.key === "Escape") doCancel();
        }));
        const c1 = el("div"); c1.appendChild(nameIn);
        const c2 = el("div"); c2.appendChild(scoreIn);
        const actions = el("div","actions");
        actions.append(btn("✔","mini","Save",doSave), btn("✖","mini","Cancel",doCancel));
        row.append(c1, c2, actions);
        setTimeout(() => nameIn.focus(), 0);
      } else {
        row.appendChild(el("div","name",(i === 0 ? "👑 " : "") + p.name));
        row.appendChild(el("div","score",p.score));
        if(isAdmin){
          const actions = el("div","actions");
          actions.append(
            btn("✏️","mini","Edit",() => { editingKey = p.key; render(); }),
            btn("🗑","mini del","Delete",() => deleteEntry(p))
          );
          row.appendChild(actions);
        }
      }
      board.appendChild(row);
      made.push(row);
    });

    if(animate){
      made.forEach(row => {
        const k = row.dataset.key, nt = row.getBoundingClientRect().top;
        let a;
        if(k in old){
          const d = old[k] - nt;
          if(Math.abs(d) < 3) return;
          if(d > 0){   // moved UP: rises from below with a golden glow
            row.style.zIndex = 5;
            a = row.animate([
              {transform:"translateY("+d+"px) scale(1.05)", boxShadow:"0 0 28px 8px rgba(245,197,66,.95)"},
              {transform:"none", boxShadow:"0 0 0 0 rgba(245,197,66,0)"}
            ], {duration:1200, easing:"cubic-bezier(.2,.9,.25,1)"});
          } else {     // got passed: slides down with a red flash
            row.style.zIndex = 1;
            a = row.animate([
              {transform:"translateY("+d+"px)", filter:"brightness(1.8) saturate(2.5)"},
              {transform:"none", filter:"none"}
            ], {duration:1200, easing:"cubic-bezier(.3,.7,.3,1)"});
          }
        } else {       // brand new on the board: rises from the bottom
          row.style.zIndex = 5;
          a = row.animate([
            {transform:"translateY(140px) scale(.9)", opacity:0},
            {transform:"none", opacity:1}
          ], {duration:1000, easing:"cubic-bezier(.2,.9,.25,1)"});
        }
        a.onfinish = () => { row.style.zIndex = ""; };
      });
    }

    $("loginArea").classList.toggle("hidden", isAdmin);
    $("dealerPanel").classList.toggle("hidden", !isAdmin);
  }

  /* ================= DATABASE ACTIONS ================= */
  async function saveEdit(key, nameVal, scoreVal){
    const name = nameVal.trim(), score = Number(scoreVal);
    if(!name || scoreVal === "" || !Number.isFinite(score)){ alert("Enter a name and a valid number."); return; }
    try {
      editingKey = null;
      await set(ref(db, "scores/" + key), { name, score });
      render();
    } catch(e){ alert("Could not save: " + (e.code || e.message)); }
  }
  async function deleteEntry(p){
    if(!confirm('Delete "' + p.name + '" (' + p.score + ')?')) return;
    try { await remove(ref(db, "scores/" + p.key)); }
    catch(e){ alert("Could not delete: " + (e.code || e.message)); }
  }
  async function addScore(){
    const name = $("nameIn").value.trim(), raw = $("scoreIn").value, score = Number(raw);
    if(!name || raw === "" || !Number.isFinite(score)){ $("addMsg").textContent = "Enter a name and a valid number."; return; }
    try {
      await push(ref(db, "scores"), { name, score });
      $("nameIn").value = ""; $("scoreIn").value = ""; $("addMsg").textContent = "";
      $("nameIn").focus();
    } catch(e){ $("addMsg").textContent = "Could not add: " + (e.code || e.message); }
  }

  /* ================= LOGIN ================= */
  async function tryLogin(){
    const pw = $("pw").value;
    if(!pw) return;
    $("loginMsg").textContent = "Checking…";
    try {
      await signInWithEmailAndPassword(auth, DEALER_EMAIL, pw);
      $("pw").value = ""; $("loginMsg").textContent = "";
    } catch(e){
      const wrong = ["auth/invalid-credential","auth/wrong-password","auth/user-not-found","auth/invalid-login-credentials"];
      $("loginMsg").textContent = wrong.includes(e.code) ? "Wrong password. The house wins. 🃏" : "Login problem: " + (e.code || e.message);
    }
  }

  $("showLoginBtn").onclick = () => { $("loginPanel").classList.toggle("hidden"); $("pw").focus(); };
  $("loginBtn").onclick = tryLogin;
  $("pw").addEventListener("keydown", e => { if(e.key === "Enter") tryLogin(); });
  $("addBtn").onclick = addScore;
  $("scoreIn").addEventListener("keydown", e => { if(e.key === "Enter") addScore(); });
  $("logoutBtn").onclick = () => { if(auth) signOut(auth); };

  /* ================= START ================= */
  drawDecor();
  render();

  if(configured){
    app = initializeApp(firebaseConfig);
    auth = getAuth(app);
    db = getDatabase(app);

    onAuthStateChanged(auth, user => {
      isAdmin = !!user;
      if(!isAdmin) editingKey = null;
      render();
    });

    onValue(ref(db, "scores"), snap => {
      const arr = [];
      snap.forEach(child => {
        const v = child.val();
        if(v && typeof v.name === "string" && typeof v.score === "number"){
          arr.push({ key: child.key, name: v.name, score: v.score });
        }
      });
      const first = !loaded;
      entries = arr; loaded = true; loadError = "";

      const sorted = arr.slice().sort((a,b) => b.score - a.score);
      const nr = {};
      sorted.forEach((p, i) => { nr[p.key] = i; });

      if(!first){
        // find the top-5 player who was pushed down the furthest up the board
        let victim = null;
        sorted.forEach(p => {
          if(p.key in ranks && ranks[p.key] < TOP && nr[p.key] > ranks[p.key]){
            if(!victim || ranks[p.key] < ranks[victim.key]) victim = p;
          }
        });
        if(victim){ horn(); toast("🎺 " + victim.name + " just got passed!"); }
      }
      ranks = nr;
      if(editingKey === null) render(!first);
    }, err => {
      loadError = err.code || err.message;
      render();
    });
  }
</script>
</body>
</html>
