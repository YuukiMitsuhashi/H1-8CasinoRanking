<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>High Rollers Leaderboard</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --felt:#0b5d3b; --felt-dark:#063d27;
    --gold:#f5c542; --gold-dark:#7a5a00;
    --red:#c8102e; --cream:#fff8e1;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; padding:24px 12px 60px;
    font-family:'Oswald',sans-serif; color:var(--cream);
    background:radial-gradient(ellipse at center,var(--felt) 0%,var(--felt-dark) 100%);
  }
  .wrap{max-width:640px; margin:0 auto}
  h1{
    font-family:'Playfair Display',serif; font-weight:900; text-align:center;
    color:var(--gold); font-size:clamp(2rem,7vw,3.2rem); margin:8px 0;
    text-shadow:0 0 14px rgba(245,197,66,.6),0 3px 0 var(--gold-dark);
  }

  .decor{
    display:flex; justify-content:center; align-items:center;
    gap:28px; flex-wrap:wrap; margin-bottom:6px;
  }
  .fan{display:flex; padding:14px 10px 6px}
  .cardwrap{
    width:64px; margin-left:-22px;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,.55));
  }
  .cardwrap:first-child{margin-left:0}
  .cardwrap svg{display:block; width:100%; height:auto}
  .dart{
    width:110px; height:110px;
    filter:drop-shadow(0 4px 8px rgba(0,0,0,.55));
  }
  .dart svg{display:block; width:100%; height:100%}

  .marquee{
    height:14px; margin:14px 0;
    background:radial-gradient(circle,var(--gold) 4px,transparent 5px) 0 0/20px 14px repeat-x;
    animation:blink 1s steps(2) infinite;
  }
  @keyframes blink{50%{filter:brightness(.35)}}

  .board{
    border:4px solid var(--gold); border-radius:18px; padding:12px;
    background:rgba(0,0,0,.28); box-shadow:0 0 25px rgba(245,197,66,.35) inset,0 8px 24px rgba(0,0,0,.5);
  }
  .row{
    display:grid; grid-template-columns:56px 1fr auto; align-items:center; gap:10px;
    padding:12px 14px; margin:8px 0; border-radius:12px;
    background:linear-gradient(90deg,rgba(255,255,255,.08),rgba(255,255,255,.02));
    border:1px solid rgba(245,197,66,.25); font-size:1.15rem;
  }
  .board.dealer .row{grid-template-columns:44px 1fr auto auto; gap:8px}
  .row.top1{background:linear-gradient(90deg,#f5c542,#b8860b); color:#2b1d00; font-weight:600; font-size:1.3rem}
  .row.top2{background:linear-gradient(90deg,#d9d9d9,#8f8f8f); color:#1d1d1d; font-weight:600}
  .row.top3{background:linear-gradient(90deg,#d08a4b,#8a5122); color:#1f1000; font-weight:600}
  .rank{font-family:'Playfair Display',serif; font-weight:900; font-size:1.4rem; text-align:center}
  .name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .score{
    font-weight:600; min-width:70px; text-align:center; padding:4px 12px;
    border-radius:999px; background:var(--red); color:#fff; border:2px dashed #fff;
  }
  .empty{text-align:center; padding:28px; opacity:.85}

  .actions{display:flex; gap:6px}
  .editIn{
    padding:6px 8px; font-size:1rem; border-radius:6px; width:100%; min-width:0;
    border:2px solid var(--gold); background:#fffdf3; color:#222;
  }
  .scoreEdit{width:90px}

  .panel{
    margin-top:22px; padding:16px; border-radius:14px;
    border:2px solid var(--gold); background:rgba(0,0,0,.35);
  }
  .panel h2{margin:0 0 10px; font-family:'Playfair Display',serif; color:var(--gold)}
  input,button{font-family:inherit; font-size:1rem}
  input{
    padding:10px 12px; border-radius:8px; border:2px solid var(--gold);
    background:#fffdf3; color:#222; width:100%;
  }
  .inline{display:flex; gap:8px; flex-wrap:wrap}
  .inline input{flex:1; min-width:120px}
  button{
    padding:10px 18px; border-radius:8px; border:2px solid var(--gold-dark);
    background:linear-gradient(#ffd75e,#e0a800); color:#2b1d00; font-weight:600; cursor:pointer;
  }
  button:hover{filter:brightness(1.1)}
  button.dark{background:#222; color:var(--gold); border-color:var(--gold)}
  .mini{padding:4px 9px; font-size:.95rem; line-height:1.1; border-radius:6px; background:rgba(0,0,0,.55); color:#fff; border:1px solid rgba(255,255,255,.6)}
  .mini.del{color:#ff9aa8}
  .msg{min-height:1.2em; margin-top:8px; color:#ffb3bd}
  .hint{font-size:.85rem; opacity:.85; margin:10px 0}
  .center{text-align:center}
  .hidden{display:none}
  .version{text-align:center; margin-top:30px; font-size:.75rem; opacity:.5}
</style>
</head>
<body>
<div class="wrap">
  <div class="decor" id="decor"></div>
  <h1>HIGH ROLLERS</h1>
  <div class="marquee"></div>

  <div class="board" id="board"></div>

  <div class="center" style="margin-top:22px" id="loginArea">
    <button class="dark" id="showLoginBtn">🎩 Dealer Entrance</button>
    <div class="panel hidden" id="loginPanel">
      <div class="inline">
        <input type="password" id="pw" placeholder="Enter password" autocomplete="off">
        <button id="loginBtn">Enter</button>
      </div>
      <div class="msg" id="loginMsg"></div>
    </div>
  </div>

  <div class="panel hidden" id="dealerPanel">
    <h2>🎰 Dealer Table</h2>
    <div class="inline">
      <input type="text" id="nameIn" placeholder="Player name" maxlength="30">
      <input type="number" id="scoreIn" placeholder="Score" step="any">
      <button id="addBtn">Deal</button>
    </div>
    <div class="msg" id="addMsg"></div>
    <div class="hint">
      Changes go live for everyone right away. Use ✏️ to fix a score and 🗑 to remove a player.
    </div>
    <button class="dark" id="logoutBtn">Leave table</button>
  </div>

  <div class="version">v5</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getDatabase, ref, onValue, push, set, remove }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  /* ============ 1. PASTE YOUR FIREBASE CONFIG HERE ============ */
  const firebaseConfig = {
    apiKey: "PASTE_API_KEY",
    authDomain: "PASTE_AUTH_DOMAIN",
    databaseURL: "PASTE_DATABASE_URL",
    projectId: "PASTE_PROJECT_ID",
    storageBucket: "PASTE_STORAGE_BUCKET",
    messagingSenderId: "PASTE_SENDER_ID",
    appId: "PASTE_APP_ID"
  };
  // Must match the user you created in Firebase Authentication
  const DEALER_EMAIL = "dealer@highrollers.app";
  /* ============================================================ */

  const $ = id => document.getElementById(id);

  /* ---------- illustrations (drawn with code) ---------- */
  const SUITS = {
    S: { col:"#1a1a1a", g:'<path d="M12 2C12 2 3 9 3 14C3 17 5.5 18.5 8 18.5C9.5 18.5 10.7 17.9 11.3 17C11 19 10.3 20.5 8.5 22L15.5 22C13.7 20.5 13 19 12.7 17C13.3 17.9 14.5 18.5 16 18.5C18.5 18.5 21 17 21 14C21 9 12 2 12 2Z"/>' },
    H: { col:"#c8102e", g:'<path d="M12 21C12 21 3 14.5 3 8.5C3 5.5 5.3 3.5 8 3.5C9.8 3.5 11.3 4.5 12 6C12.7 4.5 14.2 3.5 16 3.5C18.7 3.5 21 5.5 21 8.5C21 14.5 12 21 12 21Z"/>' },
    D: { col:"#c8102e", g:'<path d="M12 2L21 12L12 22L3 12Z"/>' },
    C: { col:"#1a1a1a", g:'<circle cx="12" cy="7.5" r="4.6"/><circle cx="7" cy="14" r="4.6"/><circle cx="17" cy="14" r="4.6"/><path d="M12 11C12 16 11 19 9 22L15 22C13 19 12 16 12 11Z"/>' }
  };

  function card(rank, suit){
    const s = SUITS[suit];
    const corner =
      '<text x="9" y="27" font-size="24" font-weight="900" fill="' + s.col + '" font-family="Playfair Display,serif">' + rank + '</text>' +
      '<g transform="translate(8,32) scale(0.75)" fill="' + s.col + '">' + s.g + '</g>';
    return '<svg viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">' +
      '<rect x="2" y="2" width="96" height="136" rx="10" fill="#fffdf3" stroke="#222" stroke-width="2.5"/>' +
      corner +
      '<g transform="rotate(180 50 70)">' + corner + '</g>' +
      '<g transform="translate(50,70) scale(2.4) translate(-12,-12)" fill="' + s.col + '">' + s.g + '</g>' +
      '</svg>';
  }

  function dartboard(){
    const C = 100;
    const pt = (r,a) => [C + r*Math.cos(a), C + r*Math.sin(a)];
    const wedge = (r1,r2,a1,a2) => {
      const p1 = pt(r2,a1), p2 = pt(r2,a2), p3 = pt(r1,a2), p4 = pt(r1,a1);
      return "M"+p1[0]+" "+p1[1]+" A"+r2+" "+r2+" 0 0 1 "+p2[0]+" "+p2[1]+
             " L"+p3[0]+" "+p3[1]+" A"+r1+" "+r1+" 0 0 0 "+p4[0]+" "+p4[1]+" Z";
    };
    const BLACK="#1a1a1a", CREAM="#f3e7c3", RED="#c8102e", GREEN="#0b7a4b";
    const rings = [
      [85.5, 90,   RED,   GREEN],
      [56.5, 85.5, BLACK, CREAM],
      [52,   56.5, RED,   GREEN],
      [8.4,  52,   BLACK, CREAM]
    ];
    let out = '<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">';
    out += '<circle cx="100" cy="100" r="98" fill="#111" stroke="#f5c542" stroke-width="3"/>';
    for(let i = 0; i < 20; i++){
      const a1 = (-90 + 18*i - 9) * Math.PI/180;
      const a2 = (-90 + 18*i + 9) * Math.PI/180;
      rings.forEach(r => {
        out += '<path d="' + wedge(r[0], r[1], a1, a2) + '" fill="' + (i % 2 === 0 ? r[2] : r[3]) + '"/>';
      });
    }
    out += '<circle cx="100" cy="100" r="8.4" fill="' + GREEN + '"/>';
    out += '<circle cx="100" cy="100" r="3.4" fill="' + RED + '"/>';
    out += '<g><line x1="100" y1="46" x2="146" y2="6" stroke="#f5c542" stroke-width="3" stroke-linecap="round"/>' +
           '<polygon points="140,2 156,6 150,20 144,12" fill="#c8102e" stroke="#7a1020" stroke-width="1"/></g>';
    out += '</svg>';
    return out;
  }

  function drawDecor(){
    const fan = [["A","S",-16],["K","H",-6],["Q","D",6],["J","C",16]]
      .map(c => '<div class="cardwrap" style="transform:rotate(' + c[2] + 'deg)">' + card(c[0], c[1]) + '</div>')
      .join("");
    $("decor").innerHTML = '<div class="fan">' + fan + '</div><div class="dart">' + dartboard() + '</div>';
  }

  /* ---------- state ---------- */
  let entries = [];        // [{ key, name, score }] live from Firebase
  let loaded = false;      // got the first data from the database
  let loadError = "";      // shown if reading fails
  let editingKey = null;   // which row is being edited
  let isAdmin = false;

  const configured = !String(firebaseConfig.apiKey).startsWith("PASTE");
  let app, auth, db;

  /* ---------- render ---------- */
  function el(tag, cls, text){
    const e = document.createElement(tag);
    if(cls) e.className = cls;
    if(text !== undefined) e.textContent = text;
    return e;
  }
  function btn(label, cls, title, fn){
    const b = el("button", cls, label);
    b.type = "button";
    b.title = title;
    b.onclick = fn;
    return b;
  }

  function render(){
    const board = $("board");
    board.textContent = "";
    board.classList.toggle("dealer", isAdmin);

    if(!configured){
      board.appendChild(el("div", "empty", "Setup not finished: paste your Firebase config into index.html."));
    } else if(loadError){
      board.appendChild(el("div", "empty", "Could not load the ranking: " + loadError));
    } else if(!loaded){
      board.appendChild(el("div", "empty", "Shuffling the deck… 🃏"));
    } else if(entries.length === 0){
      board.appendChild(el("div", "empty", "No players at the table yet. Place your bets! 🎲"));
    }

    const sorted = entries.slice().sort((a, b) => b.score - a.score);

    sorted.forEach((p, i) => {
      const row = el("div", "row" + (i < 3 ? " top" + (i+1) : ""));
      row.appendChild(el("div", "rank", i === 0 ? "👑" : "#" + (i+1)));

      if(isAdmin && editingKey === p.key){
        const nameIn = el("input", "editIn");
        nameIn.type = "text";
        nameIn.maxLength = 30;
        nameIn.value = p.name;

        const scoreIn = el("input", "editIn scoreEdit");
        scoreIn.type = "number";
        scoreIn.step = "any";
        scoreIn.value = p.score;

        const doSave = () => saveEdit(p.key, nameIn.value, scoreIn.value);
        const doCancel = () => { editingKey = null; render(); };
        [nameIn, scoreIn].forEach(inp => inp.addEventListener("keydown", e => {
          if(e.key === "Enter") doSave();
          if(e.key === "Escape") doCancel();
        }));

        const nameCell = el("div"); nameCell.appendChild(nameIn);
        const scoreCell = el("div"); scoreCell.appendChild(scoreIn);
        const actions = el("div", "actions");
        actions.append(
          btn("✔", "mini", "Save", doSave),
          btn("✖", "mini", "Cancel", doCancel)
        );
        row.append(nameCell, scoreCell, actions);
        setTimeout(() => nameIn.focus(), 0);
      } else {
        row.appendChild(el("div", "name", p.name));
        row.appendChild(el("div", "score", p.score));
        if(isAdmin){
          const actions = el("div", "actions");
          actions.append(
            btn("✏️", "mini", "Edit", () => { editingKey = p.key; render(); }),
            btn("🗑", "mini del", "Delete", () => deleteEntry(p))
          );
          row.appendChild(actions);
        }
      }
      board.appendChild(row);
    });

    $("loginArea").classList.toggle("hidden", isAdmin);
    $("dealerPanel").classList.toggle("hidden", !isAdmin);
  }

  /* ---------- database actions ---------- */
  async function saveEdit(key, nameVal, scoreVal){
    const name = nameVal.trim();
    const score = Number(scoreVal);
    if(!name || scoreVal === "" || !Number.isFinite(score)){
      alert("Enter a name and a valid number.");
      return;
    }
    try {
      await set(ref(db, "scores/" + key), { name, score });
      editingKey = null;
      render();
    } catch(e){
      alert("Could not save: " + (e.code || e.message));
    }
  }

  async function deleteEntry(p){
    if(!confirm('Delete "' + p.name + '" (' + p.score + ')?')) return;
    try {
      await remove(ref(db, "scores/" + p.key));
    } catch(e){
      alert("Could not delete: " + (e.code || e.message));
    }
  }

  async function addScore(){
    const name = $("nameIn").value.trim();
    const raw = $("scoreIn").value;
    const score = Number(raw);
    if(!name || raw === "" || !Number.isFinite(score)){
      $("addMsg").textContent = "Enter a name and a valid number.";
      return;
    }
    try {
      await push(ref(db, "scores"), { name, score });
      $("nameIn").value = "";
      $("scoreIn").value = "";
      $("addMsg").textContent = "";
      $("nameIn").focus();
    } catch(e){
      $("addMsg").textContent = "Could not add: " + (e.code || e.message);
    }
  }

  /* ---------- login ---------- */
  async function tryLogin(){
    const pw = $("pw").value;
    if(!pw) return;
    $("loginMsg").textContent = "Checking…";
    try {
      await signInWithEmailAndPassword(auth, DEALER_EMAIL, pw);
      $("pw").value = "";
      $("loginMsg").textContent = "";
    } catch(e){
      const wrong = ["auth/invalid-credential","auth/wrong-password","auth/user-not-found","auth/invalid-login-credentials"];
      $("loginMsg").textContent = wrong.includes(e.code)
        ? "Wrong password. The house wins. 🃏"
        : "Login problem: " + (e.code || e.message);
    }
  }

  /* ---------- wire up buttons ---------- */
  $("showLoginBtn").onclick = () => {
    $("loginPanel").classList.toggle("hidden");
    $("pw").focus();
  };
  $("loginBtn").onclick = tryLogin;
  $("pw").addEventListener("keydown", e => { if(e.key === "Enter") tryLogin(); });
  $("addBtn").onclick = addScore;
  $("scoreIn").addEventListener("keydown", e => { if(e.key === "Enter") addScore(); });
  $("logoutBtn").onclick = () => { if(auth) signOut(auth); };

  /* ---------- start ---------- */
  drawDecor();
  render();

  if(configured){
    app  = initializeApp(firebaseConfig);
    auth = getAuth(app);
    db   = getDatabase(app);

    onAuthStateChanged(auth, user => {
      isAdmin = !!user;
      if(!isAdmin) editingKey = null;
      render();
    });

    onValue(ref(db, "scores"), snap => {
      const arr = [];
      snap.forEach(child => {
        const v = child.val();
        if(v && typeof v.name === "string" && typeof v.score === "number"){
          arr.push({ key: child.key, name: v.name, score: v.score });
        }
      });
      entries = arr;
      loaded = true;
      loadError = "";
      // don't wipe a row you're in the middle of editing
      if(editingKey === null) render();
    }, err => {
      loadError = err.code || err.message;
      render();
    });
  }
</script>
</body>
</html>
